# Dormant by design. This workflow does NOT run on pull requests.
#
# ADR-0004 keeps Unity out of CI: compilation and tests are verified on the
# developers' own machines, and nothing here gates a pull request. See
# docs/adrs/0004-verification-unity-hors-ci.md for why, and what would reopen
# the decision.
#
# It is kept, working, for the day a licence exists — it already carries the
# two fixes that cost a PR to find: the runner runs out of disk pulling the
# 5.6 GB editor image, and the failure when no licence is configured is
# otherwise unreadable.
#
# To run it by hand, from the Actions tab, a Unity licence must first exist in
# the secrets: either UNITY_EMAIL + UNITY_PASSWORD (personal seat) or
# UNITY_LICENSE (a .ulf). Read docs/unity-init.md, section CI, before adding
# any — a personal Unity account is the wrong thing to put there.
name: Unity tests

on:
  workflow_dispatch:

jobs:
  guard:
    # Skips cleanly until the Unity project actually exists in the repo.
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.check.outputs.has_project }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f ProjectSettings/ProjectVersion.txt ]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "No ProjectSettings/ProjectVersion.txt yet — skipping Unity tests." >> "$GITHUB_STEP_SUMMARY"
          fi

  tests:
    needs: guard
    if: needs.guard.outputs.has_project == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      # Without credentials the runner still downloads the 5.6 GB editor image
      # before failing, three minutes later, on a message buried under a node
      # stack trace. Fail here instead, in seconds, naming what is missing.
      # The two strategies below are the ones this workflow passes through;
      # game-ci also supports UNITY_SERIAL and a licensing server, neither of
      # which is wired up here.
      - name: Check the Unity credentials are configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            exit 0
          fi
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            exit 0
          fi
          echo "::error::No Unity licence configured. Add either UNITY_EMAIL + UNITY_PASSWORD (personal seat) or UNITY_LICENSE (a .ulf) as repository secrets. See https://game.ci/docs/github/getting-started"
          exit 1

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.testMode }}-

      # The editor image is 5.6 GB compressed and several times that once its
      # layers are extracted. A GitHub-hosted runner ships with roughly 20 GB
      # free on /, where Docker also stores images, so the pull runs out of
      # space mid-layer: "failed to register layer: no space left on device".
      # None of the toolchains removed here are used by a Unity test run.
      # Sizes are printed so a future failure shows how much room there was.
      - name: Free disk space for the editor image
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/ghc
          df -h /

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} results
