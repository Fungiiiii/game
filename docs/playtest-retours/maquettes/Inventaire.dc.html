<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Inventaire</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
body{margin:0}
.slot{transition:filter .12s ease-out}
.slot:hover{filter:brightness(1.45)}
.slot:focus-visible{outline:3px solid #F2E6CC;outline-offset:3px}
.reset:hover{color:#F2E6CC}
@media (prefers-reduced-motion:reduce){.slot{transition:none}}
</style>
</helmet>

<svg viewBox="0 0 1280 720" width="1280" height="720" aria-hidden="true" style="position: absolute; inset: 0; display: block">
<defs>
<linearGradient id="invsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#748093"></stop><stop offset="0.62" stop-color="#344758"></stop><stop offset="1" stop-color="#1E2630"></stop></linearGradient>
<g id="invbroad">
<polygon points="-9,0 9,0 6,-124 -5,-124" fill="#4F3424"></polygon>
<polygon points="0,0 9,0 6,-124 1,-124" fill="#8A5F42"></polygon>
<polygon points="-70,-160 -45,-210 0,-232 48,-212 74,-165 50,-128 0,-116 -48,-126" fill="#6E8A3E"></polygon>
<polygon points="-45,-210 0,-232 48,-212 10,-180 -30,-176" fill="#9CB955"></polygon>
<polygon points="-48,-126 0,-116 50,-128 74,-165 20,-150 -40,-150" fill="#3E6438"></polygon>
</g>
</defs>
<rect width="1280" height="720" fill="url(#invsky)"></rect>
<polygon points="0,300 200,260 420,310 640,280 860,320 1080,270 1280,310 1280,720 0,720" fill="#2D4150"></polygon>
<polygon points="0,470 400,450 800,470 1280,450 1280,720 0,720" fill="#46562F"></polygon>
<polygon points="520,720 760,720 700,560 660,470 620,470 600,560" fill="#8C7A55"></polygon>
<g opacity="0.8">
<use href="#invbroad" transform="translate(300 480) scale(1)"></use>
<use href="#invbroad" transform="translate(520 470) scale(0.8)"></use>
<use href="#invbroad" transform="translate(800 474) scale(0.9)"></use>
<use href="#invbroad" transform="translate(1000 484) scale(1.1)"></use>
</g>
<use href="#invbroad" transform="translate(120 620) scale(2)"></use>
<use href="#invbroad" transform="translate(1180 640) scale(2.2)"></use>
</svg>
<div style="position: absolute; inset: 0; background: rgba(30, 38, 48, 0.66)"></div>

<span style="display: flex; align-items: center; gap: 8px"><span style="padding: 2px 10px 4px; background: #4F3424; color: #F2E6CC; clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px)">Clic gauche</span>prendre ou poser</span>

</sc-if>
<sc-if value="{{ heldChamponge }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" style="display: block"><polygon points="10,40 6,26 12,12 24,6 36,12 42,26 38,40 24,44" fill="#9CC3DA"></polygon><polygon points="24,6 36,12 42,26 24,24" fill="#B5D4E6"></polygon><polygon points="16,18 21,16 22,21 17,23" fill="#35506B"></polygon><polygon points="28,28 33,27 33,32 28,33" fill="#35506B"></polygon><polygon points="14,31 17,30 18,34 15,35" fill="#35506B"></polygon><polygon points="29,14 32,14 32,17 29,18" fill="#35506B"></polygon><circle cx="20" cy="27" r="1.8" fill="#2B2723"></circle><circle cx="27" cy="22" r="1.8" fill="#2B2723"></circle></svg>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slots: this.example(), held: null, gx: 640, gy: 360 };
    this.lastPress = { slot: -1, time: 0 };
  }

  example() {
    var slots = [];
    for (var i = 0; i < 15; i++) slots.push(null);
    slots[0] = { id: 'wood', n: 9 };
    slots[1] = { id: 'spore', n: 16 };
    slots[2] = { id: 'spore', n: 5 };
    slots[4] = { id: 'champonge', n: 1 };
    slots[6] = { id: 'wood', n: 4 };
    slots[7] = { id: 'champoule', n: 2 };
    slots[9] = { id: 'spore', n: 3 };
    slots[12] = { id: 'wood', n: 16 };
    slots[14] = { id: 'spore', n: 2 };
    return slots;
  }

  maxStack(id) {
    return id === 'champonge' || id === 'champoule' ? 4 : 16;
  }

  pointerIn(e) {
    var root = e.currentTarget.closest ? e.currentTarget.closest('[data-inv-root]') : null;
    if (!root) return null;
    var r = root.getBoundingClientRect();
    var k = r.width / 1280 || 1;
    return { gx: (e.clientX - r.left) / k, gy: (e.clientY - r.top) / k };
  }

  press(i, e) {
    if (e.button !== 0 && e.button !== 2) return;
    e.preventDefault();
    var max;
    var now = Date.now();
    var slots = this.state.slots.map(function (s) { return s ? { id: s.id, n: s.n } : null; });
    var held = this.state.held ? { id: this.state.held.id, n: this.state.held.n } : null;
    var isDouble = e.button === 0 && this.lastPress.slot === i && now - this.lastPress.time < 250;
    this.lastPress = e.button === 0 ? { slot: i, time: isDouble ? 0 : now } : { slot: -1, time: 0 };
    var cur = slots[i];

    if (e.button === 0) {
      if (isDouble && held) {
        // Double click: everything of the same kind comes onto the cursor, up to one stack.
        max = this.maxStack(held.id);
        for (var pass = 0; pass < 2; pass++) {
          for (var j = 0; j < slots.length && held.n < max; j++) {
            var it = slots[j];
            if (!it || it.id !== held.id) continue;
            var full = it.n >= max;
            if ((pass === 0) === full) continue;
            var moved = Math.min(max - held.n, it.n);
            held.n += moved;
            slots[j] = it.n - moved > 0 ? { id: it.id, n: it.n - moved } : null;
          }
        }
      } else if (!held) {
        if (cur) { held = cur; slots[i] = null; }
      } else if (!cur) {
        slots[i] = held; held = null;
      } else if (cur.id === held.id) {
        max = this.maxStack(cur.id);
        var add = Math.min(max - cur.n, held.n);
        cur.n += add; held.n -= add;
        if (held.n === 0) held = null;
      } else {
        slots[i] = held; held = cur;
      }
    } else {
      if (!held) {
        if (cur) {
          var take = Math.ceil(cur.n / 2);
          held = { id: cur.id, n: take };
          slots[i] = cur.n - take > 0 ? { id: cur.id, n: cur.n - take } : null;
        }
      } else if (!cur) {
        slots[i] = { id: held.id, n: 1 }; held.n -= 1;
        if (held.n === 0) held = null;
      } else if (cur.id === held.id && cur.n < this.maxStack(cur.id)) {
        cur.n += 1; held.n -= 1;
        if (held.n === 0) held = null;
      }
    }

    var p = this.pointerIn(e) || {};
    this.setState({ slots: slots, held: held, gx: p.gx != null ? p.gx : this.state.gx, gy: p.gy != null ? p.gy : this.state.gy });
  }

  renderVals() {
    var self = this;
    var names = { wood: 'Bois', spore: 'Spores', champonge: 'Champonge', champoule: 'Champoule' };
    var view = function (i) {
      var it = self.state.slots[i];
      return {
        isWood: !!it && it.id === 'wood',
        isSpore: !!it && it.id === 'spore',
        isChamponge: !!it && it.id === 'champonge',
        isChampoule: !!it && it.id === 'champoule',
        showCount: !!it && it.n > 1,
        count: it ? String(it.n) : '',
        label: it ? 'Case ' + (i + 1) + ', ' + names[it.id] + ', ' + it.n : 'Case ' + (i + 1) + ', vide',
        press: function (e) { self.press(i, e); }
      };
    };
    var main = [];
    for (var i = 0; i < 12; i++) main.push(view(i));
    var hotbar = [view(12), view(13), view(14)];
    var held = this.state.held;
    return {
      main: main,
      hotbar: hotbar,
      holding: !!held,
      heldWood: !!held && held.id === 'wood',
      heldSpore: !!held && held.id === 'spore',
      heldChamponge: !!held && held.id === 'champonge',
      heldChampoule: !!held && held.id === 'champoule',
      heldShowCount: !!held && held.n > 1,
      heldCount: held ? String(held.n) : '',
      gx: Math.round(this.state.gx),
      gy: Math.round(this.state.gy),
      cursor: held ? 'grabbing' : 'default',
      move: function (e) {
        if (!self.state.held) return;
        var p = self.pointerIn(e);
        if (p) self.setState(p);
      },
      noMenu: function (e) { e.preventDefault(); },
      reset: function () {
        self.lastPress = { slot: -1, time: 0 };
        self.setState({ slots: self.example(), held: null });
      }
    };
  }
}
</script>
</body>
